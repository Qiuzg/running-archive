<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Run Log</title>
    <meta name="description" content="一个公开展示型的个人Run Log，记录马拉松比赛、日常跑步与年度跑量。" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./src/desktop.css" />
    <link rel="stylesheet" href="./src/site-navigation.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__map" id="heroMap" aria-label="跑步路线地图"></div>
      <div class="hero__map-shade"></div>
      <div class="site-navigation-slot">
      <nav class="topbar site-navigation" aria-label="主导航">
        <a class="brand" href="./" aria-label="Run Log首页">
          <span class="brand__mark brand__mark--photo">
            <img src="/app-showcase/profile.jpg" alt="" width="44" height="44" />
          </span>
          <span>Run Log</span>
        </a>
        <div class="topbar__links">
          <a href="#/routes" data-panel-tab="routes" class="is-active">路线</a>
          <a href="#/atlas" data-panel-tab="atlas">路线集</a>
          <a href="#/races" data-panel-tab="races">比赛</a>
          <a href="#/stats" data-panel-tab="stats">统计</a>
          <a href="./journal.html">App</a>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换亮暗模式" title="切换亮暗模式">
            <span class="theme-toggle__icon">🌙</span>
          </button>
        </div>
      </nav>
      </div>
      <div class="summary-strip" id="summaryStrip"></div>
      <div class="hero__panel" id="heroPanel">
        <div class="hero__panel-header">
          <p class="eyebrow" id="panelEyebrow">Route Atlas</p>
          <h2 id="panelTitle">路线足迹</h2>
          <span id="panelSubtitle"></span>
        </div>
        <div class="hero__panel-body" id="heroPanelBody"></div>
      </div>
    </header>

    <!-- Vite dev: use module scripts; production: built bundle -->
    <script type="module" src="./src/main.js"></script>

  </body>
</html>
