# Running Archive internal Nginx server for the production /run/ proxy.
# The public TLS server forwards /run/ to http://127.0.0.1:8080/.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/running-archive/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # A single long Apple Watch workout can contain several megabytes of
        # raw GPS, heart-rate and power samples.
        client_max_body_size 25m;
        client_body_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
